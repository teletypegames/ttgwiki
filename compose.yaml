# The server side of TTGWIKI: the exporter turns the public pages of the wiki into text
# files. It writes them into the WIKI folder of the Teletype Games FTP server
# (infra/ftp-server, /srv/stacks/ftp-server on the server), which shares them as
# ftp://ftp.teletypegames.org/WIKI; set EXPORT_DIR in .env for another folder.
#
# The exporter reads Grav inside the wiki's own network (wiki-pages_default, the
# services/wiki-pages stack), so the wiki stack has to run first. It exports at start
# and then every INTERVAL seconds; a restart exports again.
name: ttgwiki

services:
  exporter:
    build: server
    image: ttgwiki-server:latest
    restart: unless-stopped
    user: "${EXPORT_UID:-1000}:${EXPORT_GID:-1000}"
    environment:
      WIKI_URL: ${WIKI_URL:-http://grav}
      PUBLIC_URL: https://wiki.teletypegames.org
      LANGUAGES: en,hu
      INTERVAL: ${INTERVAL:-900}
    volumes:
      - ${EXPORT_DIR:-/srv/stacks/ftp-server/root/WIKI}:/export
    networks:
      - wiki
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 32

networks:
  wiki:
    name: wiki-pages_default
    external: true
