; TTGWIKI settings. Lines starting with ; are comments. Without this file the
; defaults below are used.
; SERVER: the FTP server of the wiki export (from DOSBox Staging the Mac is 10.0.2.2)
SERVER=ftp.teletypegames.org
PORT=2121
; USER/PASSWORD: leave them out for anonymous login
; USER=anonymous
; PASSWORD=ttgwiki@
; PATH: the folder of the export on the server
PATH=/
; LANG: the language at start (F2 changes it): EN or HU
LANG=EN
; CODEPAGE: the code page of the screen: 437 (US) or 852 (Central European, with
; the Hungarian letters)
CODEPAGE=437
; CACHE: where the pages are kept (default: CACHE next to TTGWIKI.EXE)
; CACHE=C:\TTGWIKI\CACHE
