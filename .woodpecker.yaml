# First the fast checks (scripts/ci-check.sh): the code style, the layers, the unit tests
# of the client on the host (SOURCE/test/unit) and the tests of the server side
# (server/test). Then it builds TTGWIKI.EXE (DOS) and TTGWIKIW.EXE (Win32) with Open
# Watcom and runs the end-to-end tests: the exporter writes a small export from a fake
# wiki, the test FTP server shares it, SOURCE/test/run.sh runs TTGWIKI in a headless DOSBox
# Staging (NE2000 + mTCP), SOURCE/test/runw32.sh runs TTGWIKIW under Wine.
# scripts/ci-toolchain.sh installs the pinned Open Watcom, DOSBox Staging and clang-format,
# and Wine.
#
# A push to master that changes the server side (compose.yaml, server/) deploys it after
# the tests: the exporter runs in /srv/stacks/ttgwiki on the server and writes the WIKI
# folder of the FTP server (infra/ftp-server).
#
# A tag (vX.Y.Z, the same as Version in SOURCE/app/version.h) publishes a Gitea release:
# TTGWIKI-<tag>.zip and TTGWIKIW-<tag>.zip with the folders to install, and the two
# executables alone. It also puts both builds into the DOSINST program store
# (ftp://ftp.teletypegames.org/APPS, /srv/stacks/ftp-server/root/APPS on the server).
#
# Neither step touches the server's files: both call the server's deploy user over SSH,
# each with its own key bound on the server to one fixed command (ci-deploy,
# infra/host-config). deploy_ssh_key (push, manual) runs `ci-deploy ttgwiki`: the server
# clones master from Gitea itself, checks compose.yaml against a policy (no privileged,
# no extra capabilities or host namespaces, no docker socket, bind mounts only in the
# stack and the FTP server's WIKI folder), copies compose.yaml and server/ into
# /srv/stacks/ttgwiki and runs docker compose up -d --build (what scripts/ci-deploy.sh
# did). store_ssh_key (tag) runs `ci-deploy dos-ttgwiki-store`: the step sends the
# TTGWIKI and TTGWIKIW folders built by scripts/ci-store.sh as a tar, the server unpacks
# them unprivileged, accepts only those two folders with regular files, and swaps them
# into /srv/stacks/ftp-server/root/APPS. No trusted volumes are needed.
when:
  - event: [push, manual]
    branch: master
  - event: pull_request
  - event: tag

steps:
  - name: test
    # Debian bookworm with the toolchain of scripts/ci-toolchain.sh preinstalled
    # (services/teletypegames ci/dos-bookworm.Dockerfile); a moving tag, so always pulled.
    image: git.teletypegames.org/build/dos-ci:bookworm
    pull: true
    commands:
      - scripts/ci-toolchain.sh
      - scripts/ci-check.sh
      - scripts/ci-build.sh
      - scripts/ci-test.sh

  # Only on master, and only after the tests passed.
  - name: deploy
    image: git.teletypegames.org/build/deploy-ssh@sha256:e1753f7dd575caf5e835ff19cc152faa56478cad76c142ca0f47ad3a3f4a2605
    environment:
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
    commands:
      - mkdir -p -m 700 "$HOME/.ssh"
      - printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_deploy" && chmod 600 "$HOME/.ssh/id_deploy"
      - echo 'vps.teletype.hu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPR9RYc98lPw4w6LYlaVAkZTlleO+kE4vyWxEk9x3EDd' > "$HOME/.ssh/known_hosts"
      - ssh -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@vps.teletype.hu
    when:
      - event: [push, manual]
        branch: master
        path:
          include: [compose.yaml, "server/**", scripts/ci-deploy.sh]

  # Only on a tag, and only after the tests passed: the release gets the program the
  # test step built and tested.
  - name: release
    # curl, jq, zip and git are in the image (services/teletypegames ci/ci-tools.Dockerfile); by digest,
    # since the step gets a token
    image: git.teletypegames.org/build/ci-tools@sha256:4f03160226e51bdf67b850f21a9fbeab7314127766979f72e514efb5ef4dcba8
    environment:
      # A build started by the tag webhook may not get Woodpecker's forge credential, so
      # the token is a repository secret; the script falls back to the forge credential
      # when it is there.
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - scripts/ci-package.sh
      - scripts/ci-upload.sh
    when:
      - event: tag

  # Only on a tag, after the release: DOSINST installs and updates TTGWIKI from the store.
  - name: store
    image: git.teletypegames.org/build/deploy-ssh@sha256:e1753f7dd575caf5e835ff19cc152faa56478cad76c142ca0f47ad3a3f4a2605
    environment:
      STORE_SSH_KEY:
        from_secret: store_ssh_key
    commands:
      - rm -rf /tmp/store && mkdir /tmp/store
      - STORE=/tmp/store scripts/ci-store.sh
      - mkdir -p -m 700 "$HOME/.ssh"
      - printf '%s\n' "$STORE_SSH_KEY" > "$HOME/.ssh/id_deploy" && chmod 600 "$HOME/.ssh/id_deploy"
      - echo 'vps.teletype.hu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPR9RYc98lPw4w6LYlaVAkZTlleO+kE4vyWxEk9x3EDd' > "$HOME/.ssh/known_hosts"
      - tar -C /tmp/store -cf - . | ssh -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@vps.teletype.hu
    when:
      - event: tag
