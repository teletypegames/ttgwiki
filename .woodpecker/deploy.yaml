# A push to master that changes the server side (compose.yaml, server/) deploys it after
# the tests of the dos workflow (.woodpecker/warp.yaml, generated by WarpEngine): the
# exporter runs in /srv/stacks/ttgwiki on the server and writes the WIKI folder of the FTP
# server (infra/ftp-server).
#
# The step does not touch the server's files: it calls the server's deploy user over SSH
# with deploy_ssh_key, bound on the server to one fixed command, `ci-deploy ttgwiki`
# (infra/host-config): the server clones master from Gitea itself, checks compose.yaml
# against a policy (no privileged, no extra capabilities or host namespaces, no docker
# socket, bind mounts only in the stack and the FTP server's WIKI folder), copies
# compose.yaml and server/ into /srv/stacks/ttgwiki and runs docker compose up -d --build.
when:
  - event: [push, manual]
    branch: master
    path:
      include: [compose.yaml, "server/**"]

depends_on: [dos]

steps:
  - name: deploy
    image: git.teletypegames.org/build/deploy-ssh@sha256:e1753f7dd575caf5e835ff19cc152faa56478cad76c142ca0f47ad3a3f4a2605
    environment:
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
    commands:
      - mkdir -p -m 700 "$HOME/.ssh"
      - printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_deploy" && chmod 600 "$HOME/.ssh/id_deploy"
      - echo 'vps.teletype.hu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPR9RYc98lPw4w6LYlaVAkZTlleO+kE4vyWxEk9x3EDd' > "$HOME/.ssh/known_hosts"
      - ssh -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@vps.teletype.hu
