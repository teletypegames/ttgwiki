# The pipeline is generated by the WarpEngine of teletypegames.org (POST /build/config, the
# dos platform), and runs the commands of the build/dos-tools builder image: dos-check,
# dos-build and dos-test on every event; on a tag dos-pack (the release from metadata.json's
# dos block), the upload to WarpEngine and the Gitea release. The engine's DOS shelf is the
# FTP APPS store: a publish rebuilds it from the catalog.
# The server deploy of the exporter stack is its own workflow, .woodpecker/deploy.yaml.
# Preview: https://teletypegames.org/build/config?platform=dos&name=<name>
platform: dos
